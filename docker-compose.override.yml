# Development overrides. Compose merges this into docker-compose.yml automatically,
# so plain `docker compose up` is the development stack.
#
# To run the production-shaped stack instead, name the base file explicitly:
#   docker compose -f docker-compose.yml up --build
services:
  api:
    build:
      args:
        # The bind mount below puts server/ at /app, which shadows the image's
        # /app/web — so this container could not serve the SPA even if it
        # carried one. Building it here would cost a minute per rebuild for a
        # directory nothing can reach. Development runs Vite on the host
        # instead, proxying /api to this service. See README.
        WEB_STAGE: web-empty
    environment:
      NODE_ENV: development
    # Live reload against the mounted source. The anonymous volume keeps the
    # image's node_modules from being shadowed by the host mount.
    command: npm run dev
    volumes:
      - ./server:/app
      - /app/node_modules
